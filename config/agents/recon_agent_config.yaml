Agent_Config:
  name: recon
  prompt_key: recon_agent
  structured_output_key: ReconAgentResponse
  agent_class_key: ReconAgent
  share_history_key: exploration_exploitation
  bind_max_tokens: true
  base_path: "./config/"
  extra_prompt_kwargs: {}

Model_Params:
  provider: openai
  model_name: gpt-4o-mini
  model_path: gpt-4o-mini
  # bit_quantization: 
  max_retries: 1
  base_url: null

Pipeline_Params:
  task_type: text-generation
  max_new_tokens: 2048
  do_sample: false
  temperature: 0.2
  top_p: 0.95
  top_k: 40
  repetition_penalty: 1.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  no_repeat_ngram_size: 3
  load_playbooks: false
  load_snippets: false
  load_context: false

Generation_Config:
  temperature: 0.2
  top_p: 0.95
  top_k: 40
  max_tokens: 2048
  repetition_penalty: 1.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  no_repeat_ngram_size: 3